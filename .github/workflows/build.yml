name: Build NEXT

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Metal Toolchain
        run: |
          sudo xcodebuild -runFirstLaunch || true
          for i in 1 2 3 4 5; do
            if sudo xcodebuild -downloadComponent MetalToolchain; then break; fi
            sleep 10
          done

      - name: Build
        run: |
          # ad-hoc builds are killed by macOS if this entitlement is present
          plutil -remove com.apple.security.mach-services DynamicIsland/DynamicIsland.entitlements || true
          xcodebuild build \
            -project DynamicIsland.xcodeproj \
            -scheme DynamicIsland \
            -configuration Release \
            -destination "platform=macOS" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=YES

      - name: Package
        run: |
          APP=$(find build/Build/Products -name "NEXT.app" -maxdepth 3 | head -1)
          echo "Found: $APP"
          ditto -c -k --keepParent "$APP" NEXT.zip

      - uses: actions/upload-artifact@v4
        with:
          name: NEXT-app
          path: NEXT.zip
